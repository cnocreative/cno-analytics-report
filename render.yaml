services:
  - type: web
    name: cno-analytics-report
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

  - type: web
    name: cno-native-sync
    runtime: node
    plan: free
    rootDir: sync-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: REPORT_ORIGIN
        value: https://cno-analytics-report-5hi6.onrender.com
      # Leave this UNSET unless the service is reached through a custom domain. Unset, it derives
      # its own address from Render and therefore always matches where the service actually answers.
      #
      # Every OAuth redirect_uri is built from this value and must match what was registered with
      # the provider exactly, so a wrong value here fails every sign-in with a redirect_uri
      # mismatch and nothing explains why. Only set it once the custom domain resolves, never
      # before, or it will point providers at a hostname that does not exist yet.
      - key: PUBLIC_BASE_URL
        sync: false
      # Optional. Without it the service keeps connections in a local file that does not
      # survive a redeploy. Add a persistent Postgres URL before connecting live clients.
      - key: DATABASE_URL
        sync: false
      - key: CNO_ADMIN_TOKEN
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: SYNC_CRON_SECRET
        generateValue: true
      - key: META_CLIENT_ID
        sync: false
      - key: META_CLIENT_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
